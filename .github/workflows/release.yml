name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ''
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe
          - os: macos-latest
            target: x86_64-apple-darwin
            ext: ''
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build (release, locked)
        run: cargo build --release --locked

      - name: Rename binary with its target
        run: mv target/release/strigil${{ matrix.ext }} strigil-${{ matrix.target }}${{ matrix.ext }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: strigil-${{ matrix.target }}
          path: strigil-${{ matrix.target }}${{ matrix.ext }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            tag="continuous"
          else
            tag="${GITHUB_REF_NAME}"
          fi

          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"

          # Delete existing release for this tag if present
          release_id=$(curl -s -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            "${api}/releases/tags/${tag}" | jq -r '.id // empty')
          if [ -n "$release_id" ]; then
            echo "Deleting existing release ${release_id} for ${tag}"
            curl -s -X DELETE -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              "${api}/releases/${release_id}" > /dev/null
          fi

          # Create the release
          curl -s -X POST -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Content-Type: application/json" \
            "${api}/releases" -d "{
              \"tag_name\": \"${tag}\",
              \"name\": \"${tag}\",
              \"generate_release_notes\": true
            }" > /dev/null

          # Upload each binary asset
          release_id=$(curl -s -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            "${api}/releases/tags/${tag}" | jq -r '.id')
          for file in artifacts/*/strigil-*; do
            name=$(basename "$file")
            echo "Uploading ${name}"
            curl -s -X POST -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Content-Type: application/octet-stream" \
              "${api}/releases/${release_id}/assets?name=${name}" \
              --data-binary "@${file}" > /dev/null
          done
          echo "Release ${tag} created with assets"